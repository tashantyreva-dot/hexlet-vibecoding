<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Калькулятор суточной нормы калорий</title>
<style>
  :root {
    --bg: #f2f4f8;
    --card-bg: #ffffff;
    --primary: #4f7cff;
    --primary-dark: #3a63e0;
    --text: #1f2430;
    --muted: #6b7280;
    --border: #e2e6ef;
    --radius: 14px;
    --shadow: 0 8px 24px rgba(31, 36, 48, 0.08);
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 24px 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(180deg, #eef1f8 0%, #f7f9fc 100%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }

  .container {
    width: 100%;
    max-width: 480px;
  }

  h1 {
    font-size: 22px;
    text-align: center;
    margin: 0 0 4px;
  }

  .subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 20px;
  }

  .card {
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px;
    margin-bottom: 16px;
  }

  .field {
    margin-bottom: 16px;
  }

  .field:last-child {
    margin-bottom: 0;
  }

  label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 8px;
    color: var(--text);
  }

  .gender-toggle {
    display: flex;
    gap: 8px;
  }

  .gender-toggle input {
    display: none;
  }

  .gender-toggle label.option {
    flex: 1;
    text-align: center;
    padding: 12px 8px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s ease;
    user-select: none;
  }

  .gender-toggle input:checked + label.option {
    border-color: var(--primary);
    background: rgba(79, 124, 255, 0.08);
    color: var(--primary-dark);
    font-weight: 600;
  }

  input[type="number"],
  select {
    width: 100%;
    padding: 14px 12px;
    font-size: 16px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    background: #fff;
    color: var(--text);
    outline: none;
    transition: border-color 0.15s ease;
    -webkit-appearance: none;
    appearance: none;
  }

  input[type="number"]:focus,
  select:focus {
    border-color: var(--primary);
  }

  select {
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='8'><path d='M1 1l6 6 6-6' stroke='%236b7280' stroke-width='2' fill='none' fill-rule='evenodd'/></svg>");
    background-repeat: no-repeat;
    background-position: right 14px center;
    padding-right: 36px;
  }

  button {
    width: 100%;
    padding: 16px;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    background: var(--primary);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  button:active {
    background: var(--primary-dark);
  }

  .results {
    display: none;
  }

  .results.visible {
    display: block;
  }

  .result-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
  }

  .result-row:last-child {
    border-bottom: none;
  }

  .result-label {
    font-size: 14px;
    color: var(--muted);
  }

  .result-label small {
    display: block;
    font-size: 12px;
    color: #9aa1b1;
    margin-top: 2px;
  }

  .result-value {
    font-size: 20px;
    font-weight: 700;
    white-space: nowrap;
  }

  .result-row.maintain .result-value {
    color: var(--primary-dark);
  }

  .result-row.lose .result-value {
    color: #16a34a;
  }

  .result-row.gain .result-value {
    color: #d97706;
  }

  .hint {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    margin-top: 12px;
  }

  @media (max-width: 380px) {
    h1 {
      font-size: 19px;
    }
    .card {
      padding: 16px;
    }
  }
</style>
</head>
<body>
<div class="container">
  <h1>Калькулятор суточной нормы калорий</h1>
  <p class="subtitle">Формула Миффлина — Сан Жеора</p>

  <form class="card" id="calc-form">
    <div class="field">
      <label>Пол</label>
      <div class="gender-toggle">
        <input type="radio" name="gender" id="gender-male" value="male" checked>
        <label class="option" for="gender-male">Мужской</label>
        <input type="radio" name="gender" id="gender-female" value="female">
        <label class="option" for="gender-female">Женский</label>
      </div>
    </div>

    <div class="field">
      <label for="age">Возраст, лет</label>
      <input type="number" id="age" inputmode="numeric" min="1" max="120" placeholder="Например, 30" required>
    </div>

    <div class="field">
      <label for="height">Рост, см</label>
      <input type="number" id="height" inputmode="numeric" min="50" max="250" placeholder="Например, 175" required>
    </div>

    <div class="field">
      <label for="weight">Вес, кг</label>
      <input type="number" id="weight" inputmode="decimal" min="20" max="400" step="0.1" placeholder="Например, 70" required>
    </div>

    <div class="field">
      <label for="activity">Уровень активности</label>
      <select id="activity">
        <option value="1.2">Сидячий образ жизни</option>
        <option value="1.375">Лёгкая активность (1-3 тренировки в неделю)</option>
        <option value="1.55">Умеренная активность (3-5 тренировок в неделю)</option>
        <option value="1.725">Высокая активность (6-7 тренировок в неделю)</option>
        <option value="1.9">Очень высокая активность (тяжёлый труд/спорт)</option>
      </select>
    </div>

    <div class="field">
      <button type="submit">Рассчитать</button>
    </div>
  </form>

  <div class="card results" id="results">
    <div class="result-row maintain">
      <div class="result-label">Поддержание веса<small>ваша суточная норма</small></div>
      <div class="result-value" id="result-maintain">—</div>
    </div>
    <div class="result-row lose">
      <div class="result-label">Похудение<small>−15% от нормы</small></div>
      <div class="result-value" id="result-lose">—</div>
    </div>
    <div class="result-row gain">
      <div class="result-label">Набор массы<small>+15% от нормы</small></div>
      <div class="result-value" id="result-gain">—</div>
    </div>
    <p class="hint">Значения указаны в ккал/сутки</p>
  </div>
</div>

<script>
  document.getElementById('calc-form').addEventListener('submit', function (e) {
    e.preventDefault();

    var gender = document.querySelector('input[name="gender"]:checked').value;
    var age = parseFloat(document.getElementById('age').value);
    var height = parseFloat(document.getElementById('height').value);
    var weight = parseFloat(document.getElementById('weight').value);
    var activity = parseFloat(document.getElementById('activity').value);

    if (!age || !height || !weight) {
      return;
    }

    var bmr;
    if (gender === 'male') {
      bmr = 10 * weight + 6.25 * height - 5 * age + 5;
    } else {
      bmr = 10 * weight + 6.25 * height - 5 * age - 161;
    }

    var maintain = bmr * activity;
    var lose = maintain * 0.85;
    var gain = maintain * 1.15;

    document.getElementById('result-maintain').textContent = Math.round(maintain) + ' ккал';
    document.getElementById('result-lose').textContent = Math.round(lose) + ' ккал';
    document.getElementById('result-gain').textContent = Math.round(gain) + ' ккал';

    document.getElementById('results').classList.add('visible');
    document.getElementById('results').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  });
</script>
</body>
</html>
